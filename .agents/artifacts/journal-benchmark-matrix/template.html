<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ TITLE }}</title>
  <style>
    :root {
      --bg: #090e17;
      --card: #131d2e;
      --border: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #10b981;
      --primary: #6366f1;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    header {
      background: rgba(19, 29, 46, 0.95);
      backdrop-filter: blur(8px);
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .badge {
      background: rgba(16, 185, 129, 0.15);
      color: var(--accent);
      padding: 3px 8px;
      border-radius: 9999px;
      font-size: 11px;
      font-weight: 600;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }
    h1 { font-size: 14px; font-weight: 600; }
    .content-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      padding: 14px;
      flex: 1;
    }
    @media (max-width: 768px) { .content-grid { grid-template-columns: 1fr; } }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px;
      display: flex;
      flex-direction: column;
    }
    .card-title {
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 12px;
    }
    .index-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 10px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      font-size: 12px;
    }
    .status-ok { color: #10b981; font-weight: bold; }
    .status-no { color: #64748b; }
    .diamond-banner {
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.15), rgba(99, 102, 241, 0.15));
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
  </style>
</head>
<body>
  <header>
    <div style="display:flex; align-items:center; gap:10px;">
      <span class="badge">Inteligencia Editorial</span>
      <h1>{{ TITLE }}</h1>
    </div>
  </header>

  <div class="content-grid">
    <!-- Card 1: Perfil Editorial y Diamond OA -->
    <div class="card">
      <div class="card-title">📖 Perfil de la Revista</div>
      <div id="diamond-box"></div>
      <div style="font-size:13px; line-height:1.8;">
        <div><strong>Revista:</strong> <span id="j-name">--</span></div>
        <div><strong>ISSN:</strong> <span id="j-issn">--</span></div>
        <div><strong>Editorial:</strong> <span id="j-pub">--</span></div>
        <div><strong>Cuartil SJR / Scopus:</strong> <span id="j-q">--</span></div>
      </div>
    </div>

    <!-- Card 2: Checklist de Indexación -->
    <div class="card">
      <div class="card-title">🛡️ Indexación & Calidad Editorial</div>
      <div id="index-list"></div>
    </div>
  </div>

  <script>
    const data = {{ DATA_JSON }};
    document.getElementById("j-name").textContent = data.journal_name || "--";
    document.getElementById("j-issn").textContent = data.issn || "N/A";
    document.getElementById("j-pub").textContent = data.publisher || "Institucional";
    document.getElementById("j-q").textContent = data.scimago_quartile || "N/A";

    const dBox = document.getElementById("diamond-box");
    if (data.diamond_oa || data.apc_usd === 0) {
      dBox.innerHTML = `
        <div class="diamond-banner">
          <div>
            <strong style="color:#38bdf8; font-size:14px;">💎 Acceso Abierto Diamante</strong>
            <div style="font-size:11px; color:#94a3b8; margin-top:2px;">Sin cargos de publicación (APC: $0 USD)</div>
          </div>
          <span style="font-size:20px;">✨</span>
        </div>
      `;
    } else {
      dBox.innerHTML = `
        <div class="diamond-banner" style="border-color:rgba(245,158,11,0.3); background:rgba(245,158,11,0.1);">
          <div>
            <strong style="color:#f59e0b; font-size:14px;">🥇 Acceso Abierto Comercial (Gold APC)</strong>
            <div style="font-size:11px; color:#94a3b8; margin-top:2px;">Costo APC estimado: $${data.apc_usd || 'N/A'} USD</div>
          </div>
          <span style="font-size:20px;">💵</span>
        </div>
      `;
    }

    const idx = data.indexes || {};
    const indexNames = {
      doaj: "DOAJ (Directory of Open Access Journals)",
      scielo: "SciELO México / Regional",
      redalyc: "Redalyc (Red de Revistas Científicas)",
      latindex_catalogo_2: "Latindex Catálogo 2.0 (38 Criterios)",
      scopus: "Scopus (Elsevier)",
      wos_esci_scie: "Web of Science (ESCI / SCIE / SSCI)"
    };

    const idxList = document.getElementById("index-list");
    for (const [key, title] of Object.entries(indexNames)) {
      const isIndexed = idx[key] === true;
      idxList.innerHTML += `
        <div class="index-item">
          <span>${title}</span>
          <span class="${isIndexed ? 'status-ok' : 'status-no'}">${isIndexed ? '✅ Indexada' : '❌ No reportada'}</span>
        </div>
      `;
    }
  </script>
</body>
</html>
