<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ TITLE }}</title>
  <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
  <style>
    :root {
      --bg: #090e17;
      --card: #131d2e;
      --border: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #ec4899;
      --primary: #6366f1;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      background: rgba(19, 29, 46, 0.95);
      backdrop-filter: blur(8px);
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      z-index: 10;
    }
    .badge {
      background: rgba(236, 72, 153, 0.15);
      color: var(--accent);
      padding: 3px 8px;
      border-radius: 9999px;
      font-size: 11px;
      font-weight: 600;
      border: 1px solid rgba(236, 72, 153, 0.3);
    }
    h1 { font-size: 14px; font-weight: 600; }
    .metrics-row {
      display: flex;
      gap: 12px;
      padding: 10px 16px;
      background: var(--card);
      border-bottom: 1px solid var(--border);
    }
    .metric-pill {
      background: var(--bg);
      border: 1px solid var(--border);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 11px;
      color: var(--muted);
    }
    .metric-pill strong { color: var(--text); }
    #plot-container { flex: 1; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <header>
    <div style="display:flex; align-items:center; gap:10px;">
      <span class="badge" id="law-badge">Leyes Bibliométricas</span>
      <h1>{{ TITLE }}</h1>
    </div>
  </header>

  <div class="metrics-row" id="metrics-bar"></div>
  <div id="plot-container"></div>

  <script>
    const data = {{ DATA_JSON }};
    const lawType = (data.law_type || "lotka").toUpperCase();
    document.getElementById("law-badge").textContent = `Ley de ${lawType}`;

    const metricsBar = document.getElementById("metrics-bar");
    const m = data.fit_metrics || {};
    if (m.r_squared !== undefined) metricsBar.innerHTML += `<div class="metric-pill">R² de Ajuste: <strong>${m.r_squared}</strong></div>`;
    if (m.alpha_exponent !== undefined) metricsBar.innerHTML += `<div class="metric-pill">Exponente α: <strong>${m.alpha_exponent}</strong></div>`;
    if (m.doubling_time_years !== undefined) metricsBar.innerHTML += `<div class="metric-pill">Tiempo Duplicación: <strong>${m.doubling_time_years} años</strong></div>`;
    if (m.phase) metricsBar.innerHTML += `<div class="metric-pill">Fase: <strong>${m.phase}</strong></div>`;

    const empPoints = data.empirical_points || [];
    const fitPoints = data.fitted_curve || [];

    const traceEmp = {
      x: empPoints.map(p => p.x),
      y: empPoints.map(p => p.y),
      mode: 'markers',
      type: 'scatter',
      name: 'Datos Empíricos',
      marker: { color: '#ec4899', size: 8, symbol: 'circle' }
    };

    const traceFit = {
      x: fitPoints.map(p => p.x),
      y: fitPoints.map(p => p.y),
      mode: 'lines',
      type: 'scatter',
      name: 'Ajuste Teórico',
      line: { color: '#38bdf8', width: 2.5, dash: 'solid' }
    };

    const layout = {
      paper_bgcolor: '#090e17',
      plot_bgcolor: '#090e17',
      margin: { t: 30, r: 30, b: 50, l: 60 },
      font: { color: '#94a3b8', family: '-apple-system, sans-serif' },
      xaxis: {
        title: lawType === 'LOTKA' ? 'Número de Publicaciones (x)' : 'Rango / Variable X',
        gridcolor: '#1e293b',
        zerolinecolor: '#334155'
      },
      yaxis: {
        title: lawType === 'LOTKA' ? 'Número de Autores (y)' : 'Frecuencia / Variable Y',
        gridcolor: '#1e293b',
        zerolinecolor: '#334155'
      },
      legend: { orientation: 'h', y: 1.1, x: 0.5, xanchor: 'center' }
    };

    Plotly.newPlot('plot-container', [traceEmp, traceFit], layout, { responsive: true, displayModeBar: false });
  </script>
</body>
</html>
