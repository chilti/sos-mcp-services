<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ TITLE }}</title>
  <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
  <style>
    :root {
      --bg: #090e17;
      --card: #131d2e;
      --border: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #3b82f6;
      --primary: #6366f1;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    header {
      background: rgba(19, 29, 46, 0.95);
      backdrop-filter: blur(8px);
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .badge {
      background: rgba(59, 130, 246, 0.15);
      color: var(--accent);
      padding: 3px 8px;
      border-radius: 9999px;
      font-size: 11px;
      font-weight: 600;
      border: 1px solid rgba(59, 130, 246, 0.3);
    }
    h1 { font-size: 14px; font-weight: 600; }
    .kpi-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      padding: 14px 14px 0 14px;
    }
    @media (max-width: 768px) { .kpi-row { grid-template-columns: repeat(2, 1fr); } }
    .kpi-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      text-align: center;
    }
    .kpi-value { font-size: 20px; font-weight: 700; color: #fff; margin: 4px 0; }
    .kpi-label { font-size: 11px; color: var(--muted); text-transform: uppercase; }
    #radar-container { flex: 1; min-height: 380px; width: 100%; padding: 14px; }
  </style>
</head>
<body>
  <header>
    <div style="display:flex; align-items:center; gap:10px;">
      <span class="badge">InCites Benchmarking</span>
      <h1>{{ TITLE }}</h1>
    </div>
  </header>

  <div class="kpi-row">
    <div class="kpi-card">
      <div class="kpi-label">Impacto Normalizado (CNCI/FWCI)</div>
      <div class="kpi-value" style="color:#38bdf8;" id="kpi-fwci">1.00</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label">% Top 10% Más Citado</div>
      <div class="kpi-value" style="color:#10b981;" id="kpi-top10">0%</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label">% Colab. Internacional</div>
      <div class="kpi-value" style="color:#f59e0b;" id="kpi-collab">0%</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label">Total Publicaciones</div>
      <div class="kpi-value" style="color:#a855f7;" id="kpi-docs">0</div>
    </div>
  </div>

  <div id="radar-container"></div>

  <script>
    const data = {{ DATA_JSON }};
    const m = data.metrics || {};
    document.getElementById("kpi-fwci").textContent = m.mean_fwci ? m.mean_fwci.toFixed(2) : "1.00";
    document.getElementById("kpi-top10").textContent = m.pct_top_10_percent ? `${m.pct_top_10_percent}%` : "--";
    document.getElementById("kpi-collab").textContent = m.pct_international_collab ? `${m.pct_international_collab}%` : "--";
    document.getElementById("kpi-docs").textContent = m.web_of_science_documents ? m.web_of_science_documents.toLocaleString() : "--";

    const disc = data.radar_disciplines || [
      { discipline: "Ciencias Naturales", institution_score: 1.4, baseline_score: 1.0 },
      { discipline: "Ingeniería & Tecnología", institution_score: 1.1, baseline_score: 1.0 },
      { discipline: "Ciencias Médicas", institution_score: 1.3, baseline_score: 1.0 },
      { discipline: "Ciencias Agrícolas", institution_score: 0.9, baseline_score: 1.0 },
      { discipline: "Ciencias Sociales", institution_score: 1.0, baseline_score: 1.0 },
      { discipline: "Humanidades", institution_score: 1.2, baseline_score: 1.0 }
    ];

    const traceInst = {
      type: 'scatterpolar',
      r: disc.map(d => d.institution_score),
      theta: disc.map(d => d.discipline),
      fill: 'toself',
      name: data.institution_name || 'Institución',
      fillcolor: 'rgba(56, 189, 248, 0.25)',
      line: { color: '#38bdf8', width: 2 }
    };

    const traceBase = {
      type: 'scatterpolar',
      r: disc.map(d => d.baseline_score || 1.0),
      theta: disc.map(d => d.discipline),
      name: 'Media Mundial (1.0)',
      line: { color: '#64748b', width: 1.5, dash: 'dash' }
    };

    const layout = {
      paper_bgcolor: '#090e17',
      plot_bgcolor: '#090e17',
      font: { color: '#94a3b8', family: '-apple-system, sans-serif' },
      margin: { t: 20, r: 40, b: 30, l: 40 },
      polar: {
        bgcolor: '#131d2e',
        radialaxis: { visible: true, range: [0, Math.max(2, ...disc.map(d => d.institution_score * 1.2))], gridcolor: '#1e293b' },
        angularaxis: { gridcolor: '#1e293b' }
      },
      legend: { orientation: 'h', y: -0.1, x: 0.5, xanchor: 'center' }
    };

    Plotly.newPlot('radar-container', [traceInst, traceBase], layout, { responsive: true, displayModeBar: false });
  </script>
</body>
</html>
