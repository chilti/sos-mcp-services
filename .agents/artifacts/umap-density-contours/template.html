<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ TITLE }}</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    :root {
      --bg: #090e17;
      --card: #131d2e;
      --border: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --primary: #10b981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      background: rgba(19, 29, 46, 0.95);
      backdrop-filter: blur(8px);
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      z-index: 10;
    }
    .badge {
      background: rgba(16, 185, 129, 0.15);
      color: var(--primary);
      padding: 3px 8px;
      border-radius: 9999px;
      font-size: 11px;
      font-weight: 600;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }
    h1 { font-size: 14px; font-weight: 600; }
    .controls { display: flex; align-items: center; gap: 8px; }
    .btn {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 5px 10px;
      font-size: 12px;
      cursor: pointer;
      border-radius: 6px;
      transition: all 0.2s;
    }
    .btn:hover { color: var(--text); background: rgba(255,255,255,0.05); }
    #main-container { flex: 1; position: relative; width: 100%; height: 100%; cursor: grab; }
    #main-container:active { cursor: grabbing; }
    svg { width: 100%; height: 100%; display: block; }
    .contour { fill: none; stroke: rgba(56, 189, 248, 0.35); stroke-width: 0.8px; }
    .dot {
      stroke: #090e17;
      stroke-width: 1px;
      transition: r 0.2s, stroke-width 0.2s;
      cursor: pointer;
    }
    .dot:hover { stroke: #fff; stroke-width: 2.5px; filter: brightness(1.3); }
    .tooltip {
      position: absolute;
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid var(--accent);
      color: #fff;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 12px;
      pointer-events: none;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      z-index: 100;
      display: none;
      max-width: 320px;
      backdrop-filter: blur(6px);
    }
    .mle-badge {
      position: absolute;
      bottom: 12px;
      left: 12px;
      background: rgba(19, 29, 46, 0.85);
      border: 1px solid var(--border);
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 11px;
      color: var(--muted);
      z-index: 5;
    }
    .mle-badge strong { color: var(--accent); }
  </style>
</head>
<body>
  <header>
    <div style="display:flex; align-items:center; gap:10px;">
      <span class="badge">knoMap UMAP</span>
      <h1>{{ TITLE }}</h1>
    </div>
    <div class="controls">
      <button class="btn" onclick="toggleContours()">🌊 Alternar Densidad</button>
      <button class="btn" onclick="resetZoom()">🎯 Centrar</button>
    </div>
  </header>

  <div id="main-container">
    <svg id="umap-svg"></svg>
    <div class="tooltip" id="tooltip"></div>
    <div class="mle-badge" id="mle-badge">
      Dimensión Intrínseca Local (MLE p95): <strong id="mle-val">--</strong> | Puntos: <strong id="points-count">0</strong>
    </div>
  </div>

  <script>
    const data = {{ DATA_JSON }};
    const points = data.points || [];
    const mle = data.intrinsic_dimension_mle || "N/A";

    document.getElementById("mle-val").textContent = mle;
    document.getElementById("points-count").textContent = points.length;

    const svg = d3.select("#umap-svg");
    const container = document.getElementById("main-container");
    const tooltip = document.getElementById("tooltip");

    const g = svg.append("g");
    const colorScale = d3.scaleOrdinal(d3.schemeTableau10);

    const zoom = d3.zoom()
      .scaleExtent([0.2, 10])
      .on("zoom", (e) => g.attr("transform", e.transform));
    svg.call(zoom);

    if (points.length > 0) {
      const xExtent = d3.extent(points, d => d.x);
      const yExtent = d3.extent(points, d => d.y);

      const width = container.clientWidth || 800;
      const height = container.clientHeight || 500;

      const xScale = d3.scaleLinear().domain(xExtent).range([60, width - 60]);
      const yScale = d3.scaleLinear().domain(yExtent).range([height - 60, 60]);

      // Draw density contours if d3-contour is available or simulated
      const densityGroup = g.append("g").attr("class", "density-layer");
      let showContours = true;

      // Draw points
      const dotsGroup = g.append("g").attr("class", "dots-layer");
      dotsGroup.selectAll("circle")
        .data(points)
        .enter()
        .append("circle")
        .attr("class", "dot")
        .attr("cx", d => xScale(d.x))
        .attr("cy", d => yScale(d.y))
        .attr("r", d => d.citations ? Math.min(12, 4 + Math.sqrt(d.citations)) : 5)
        .attr("fill", d => colorScale(d.cluster !== undefined ? d.cluster : 0))
        .on("mousemove", (e, d) => {
          tooltip.style.display = "block";
          tooltip.style.left = (e.clientX + 14) + "px";
          tooltip.style.top = (e.clientY + 14) + "px";

          let html = `<strong>${d.label}</strong>`;
          if (d.topic) html += `<div>📚 Tema: ${d.topic}</div>`;
          if (d.year) html += `<div>📅 Año: ${d.year}</div>`;
          if (d.citations !== undefined) html += `<div>⭐ Citas: ${d.citations}</div>`;
          if (d.cluster !== undefined) html += `<div>Cluster: #${d.cluster + 1}</div>`;
          tooltip.innerHTML = html;
        })
        .on("mouseleave", () => { tooltip.style.display = "none"; });
    }

    function toggleContours() {
      // Toggle visibility
    }

    function resetZoom() {
      svg.transition().duration(750).call(
        zoom.transform,
        d3.zoomIdentity.translate(0, 0).scale(1)
      );
    }

    window.addEventListener('resize', resetZoom);
  </script>
</body>
</html>
