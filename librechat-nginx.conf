# ============================================================
# CONFIGURACIÓN NGINX: LIBRECHAT + REPORTES FASTMCP
# Puerto Seguro: 8443 (HTTPS)
# Dominio: dinamica1.fciencias.unam.mx
# ============================================================

server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    server_name dinamica1.fciencias.unam.mx;

    # Certificados SSL de Let's Encrypt (reutiliza los de dinamica1)
    ssl_certificate     /etc/letsencrypt/live/dinamica1.fciencias.unam.mx/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dinamica1.fciencias.unam.mx/privkey.pem;
    
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Límite de subida de archivos (documentos, imágenes, etc.)
    client_max_body_size 100M;

    # ------------------------------------------------------------
    # 1. REPORTES INTERACTIVOS FASTMCP (Puerto 8015)
    # Debe ir antes de location / para tener prioridad exacta
    # ------------------------------------------------------------
    location /reports/ {
        proxy_pass http://127.0.0.1:8015/reports/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Evitar caché para que los reportes nuevos carguen inmediatamente
        proxy_cache off;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # ------------------------------------------------------------
    # 2. LIBRECHAT PRINCIPAL (Puerto 3080)
    # Atiende /, /c/<conversation_id>, /api/, /assets/
    # ------------------------------------------------------------
    location / {
        proxy_pass http://127.0.0.1:3080;
        proxy_http_version 1.1;

        # Soporte para WebSockets (imprescindible para LibreChat)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Cabeceras estándar de proxy
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Streaming en tiempo real (Server-Sent Events / SSE)
        proxy_buffering off;
        proxy_cache off;

        # Timeouts largos para respuestas extensas de LLMs
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 600s;
    }
}
