services:
  knomap-mcp:
    build:
      context: .
      dockerfile: services/knomap/Dockerfile
      network: host
    environment:
      - MCP_TRANSPORT=http
      - PORT=8001
      - CLICKHOUSE_HOST=${CLICKHOUSE_HOST:-clickhouse}
    ports:
      - "8010:8001"
    restart: unless-stopped
    networks:
      - mcp-network

  sinapsisai-mcp:
    build:
      context: .
      dockerfile: services/sinapsisai/Dockerfile
      network: host
    environment:
      - MCP_TRANSPORT=http
      - PORT=8002
      - NEO4J_URI=${NEO4J_URI:-bolt://neo4j:7687}
      - QDRANT_HOST=${QDRANT_HOST:-qdrant}
    ports:
      - "8011:8002"
    restart: unless-stopped
    networks:
      - mcp-network

  plmetrix-mcp:
    build:
      context: .
      dockerfile: services/plmetrix/Dockerfile
      network: host
    environment:
      - MCP_TRANSPORT=http
      - PORT=8003
    ports:
      - "8012:8003"
    restart: unless-stopped
    networks:
      - mcp-network

  revistaslatam-mcp:
    build:
      context: .
      dockerfile: services/revistaslatam/Dockerfile
      network: host
    environment:
      - MCP_TRANSPORT=http
      - PORT=8004
    ports:
      - "8013:8004"
    restart: unless-stopped
    networks:
      - mcp-network

  topics-mcp:
    build:
      context: .
      dockerfile: services/topics/Dockerfile
      network: host
    environment:
      - MCP_TRANSPORT=http
      - PORT=8005
      - CLICKHOUSE_HOST=${CLICKHOUSE_HOST:-clickhouse}
    ports:
      - "8014:8005"
    restart: unless-stopped
    networks:
      - mcp-network

  openalex-mcp:
    build:
      context: .
      dockerfile: services/openalex/Dockerfile
      network: host
    environment:
      - MCP_TRANSPORT=http
      - PORT=8006
      - CLICKHOUSE_HOST=${CLICKHOUSE_HOST:-clickhouse}
    ports:
      - "8015:8006"
    restart: unless-stopped
    networks:
      - mcp-network

networks:
  mcp-network:
    driver: bridge

